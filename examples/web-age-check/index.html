<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Age check</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 480px; margin: 64px auto; padding: 0 16px; }
      button { font: inherit; padding: 8px 16px; }
    </style>
  </head>
  <body>
    <h1>Are you over 18?</h1>
    <button id="check">Verify with test wallet</button>
    <p id="result" aria-live="polite"></p>

    <script type="module">
      import { verify } from "../../packages/sd-jwt/dist/index.js";
      import { createTestIssuer, createTestWallet, samplePid } from "../../packages/sd-jwt/dist/testing.js";

      const issuer = await createTestIssuer();
      const wallet = await createTestWallet();
      const credential = await issuer.issue(samplePid, { holder: wallet.publicKey });

      document.querySelector("#check").onclick = async () => {
        const result = document.querySelector("#result");
        // In production, the nonce comes from your server and verify() runs there.
        const nonce = crypto.randomUUID();
        const audience = location.origin;
        const presentation = await wallet.present(credential, { nonce, audience, disclose: ["age_equal_or_over.18"] });

        try {
          const { claims } = await verify(presentation, { issuerKey: issuer.publicKey, nonce, audience });
          result.textContent = claims.age_equal_or_over?.["18"] ? "Yes. Nothing else was shared." : "No.";
        } catch (error) {
          result.textContent = error.message;
        }
      };
    </script>
  </body>
</html>
